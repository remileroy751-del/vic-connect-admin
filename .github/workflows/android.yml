name: Build VIC-CONNECT Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compiler VIC-CONNECT
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Préparer Android SDK
        shell: bash
        run: |
          set -e
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "${ANDROID_SDK_ROOT}/platform-tools" >> "$GITHUB_PATH"

          # GitHub Ubuntu peut avoir sdkmanager dans une version numérotée
          # de cmdline-tools au lieu de cmdline-tools/latest/bin.
          SDKMANAGER=""
          if [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager -perm -111 2>/dev/null | head -n 1 || true)"
          fi

          if [ -n "$SDKMANAGER" ]; then
            SDKMANAGER_DIR="$(dirname "$SDKMANAGER")"
            echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"
            echo "sdkmanager trouvé : $SDKMANAGER"
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          else
            echo "sdkmanager non trouvé : utilisation du SDK Android préinstallé sur le runner GitHub."
          fi

          # Vérification obligatoire pour éviter de lancer Gradle avec un SDK incomplet.
          test -d "$ANDROID_SDK_ROOT/platforms/android-35"
          test -d "$ANDROID_SDK_ROOT/build-tools/35.0.0"
          test -d "$ANDROID_SDK_ROOT/platform-tools"

      - name: Installer Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Vérifier l'environnement Android
        shell: bash
        run: |
          set -e
          java -version
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la "$ANDROID_SDK_ROOT/platforms/android-35"
          ls -la "$ANDROID_SDK_ROOT/build-tools/35.0.0"
          ls -la "$ANDROID_SDK_ROOT/platform-tools"

      - name: Compiler l'APK Debug
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publier l'APK en artefact
        uses: actions/upload-artifact@v4
        with:
          name: VIC-CONNECT-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
